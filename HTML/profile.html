<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Page</title>
    <link rel="stylesheet" href="../CSS/styleprofile.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="ocean-background">
        </div>

    <div class="card-container">
        <div class="profile-card">
            <div class="card-header">
            <img src="../pic/me1.jpeg" alt="Foto Profil" class="profile-img">
            </div>
            <div class="card-body">
                <h2 class="profile-name">Rangga Surya Saputra</h2>
                <p class="profile-title">fresh Graduate Student yang sedang mencari jati diri</p>
                <p class="profile-bio" id="animatedBio"></p>
            </div>
            <div class="card-social">
                <a href="#" class="social-icon"><i class="fab fa-github"></i></a>
                <a href="#" class="social-icon"><i class="fab fa-twitter"></i></a>
                <a href="#" class="social-icon"><i class="fab fa-instagram"></i></a>
                <a href="#" class="social-icon"><i class="fab fa-linkedin-in"></i></a>
            </div>
            <div class="card-actions">
                <button class="btn btn-follow">Jelajahi</button>
                <button class="btn btn-message">pesan</button>
            </div>
        </div>
    </div>
    <script src="../JS/profile.js"></script>
</body>
</html>
