<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Outer gold ring -->
  <circle cx="50" cy="50" r="48" fill="#1A0E06" stroke="#D4A017" stroke-width="4"/>
  <!-- Inner ring -->
  <circle cx="50" cy="50" r="40" fill="none" stroke="#D4A017" stroke-width="1" stroke-dasharray="4 3" opacity="0.6"/>
  <!-- Cardinal tick marks N/S/E/W -->
  <line x1="50" y1="12" x2="50" y2="20" stroke="#D4A017" stroke-width="2"/>
  <line x1="50" y1="80" x2="50" y2="88" stroke="#D4A017" stroke-width="2"/>
  <line x1="12" y1="50" x2="20" y2="50" stroke="#D4A017" stroke-width="2"/>
  <line x1="80" y1="50" x2="88" y2="50" stroke="#D4A017" stroke-width="2"/>
  <!-- North needle (gold/parchment) -->
  <polygon points="50,14 54,48 50,44 46,48" fill="#FFD700"/>
  <polygon points="50,14 54,48 50,44 46,48" fill="#F5DEB3" opacity="0.4" transform="scale(-1,1) translate(-100,0)"/>
  <!-- South needle (dark) -->
  <polygon points="50,86 54,52 50,56 46,52" fill="#6F4E37"/>
  <!-- Center jewel -->
  <circle cx="50" cy="50" r="5" fill="#0D9488"/>
  <circle cx="50" cy="50" r="2.5" fill="#14B8A6"/>
</svg>